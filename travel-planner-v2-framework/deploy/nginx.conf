server {
    listen 80;
    server_name 124.220.224.77;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/travel-auth-acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name 124.220.224.77;
    ssl_certificate /etc/letsencrypt/live/travel-auth-profile-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travel-auth-profile-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TravelTLS:10m;
    ssl_session_timeout 1d;
    root /var/www/travel-auth-profile/current;
    index index.html;
    client_max_body_size 110m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        add_header Cache-Control no-store always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
    }
    location ~ /\. { deny all; }
}
